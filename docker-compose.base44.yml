services:
  web:
    image: nginx:alpine
    ports: ["3000:80"]
    volumes:
      - ./muvbyyycodingstudio:/usr/share/nginx/html:ro
    restart: on-failure
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 3
